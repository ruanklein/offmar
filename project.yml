name: OffMar
options:
  bundleIdPrefix: dev.local
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGNING_ALLOWED: NO
targets:
  OffMar:
    type: application
    platform: macOS
    sources: [OffMar]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.local.OffMar
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_CFBundleDisplayName: OffMar
        INFOPLIST_KEY_CFBundleDevelopmentRegion: en
        ENABLE_APP_SANDBOX: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
  OffMarTests:
    type: bundle.unit-test
    platform: macOS
    sources: [OffMarTests]
    dependencies:
      - target: OffMar
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  OffMar:
    build:
      targets:
        OffMar: all
    test:
      targets: [OffMarTests]
